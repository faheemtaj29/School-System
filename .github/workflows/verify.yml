name: Automated Verification

on:
  push:
    branches:
      - main
      - fix/phase1-attendance-permissions
  pull_request:
    branches:
      - main
      - fix/phase1-attendance-permissions
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, Type Check, and Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Build Next.js application
        run: npm run build
        env:
          # Test-only values for build-time configuration; never connect to a real database.
          MONGODB_URI: mongodb://127.0.0.1:27017/school_system_ci
          JWT_SECRET: ci-only-not-a-real-secret
